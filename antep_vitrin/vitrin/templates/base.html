<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antep Yöresel Ürünler</title>
    <!-- Bootstrap CSS (Hazır tasarım kütüphanesi) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f9f9f9; }
        .navbar-brand { font-weight: bold; color: #b71c1c !important; font-size: 1.5rem; }
        .btn-antep { background-color: #b71c1c; color: white; }
        .btn-antep:hover { background-color: #7f0000; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4 py-3">
        <div class="container">
            <a class="navbar-brand" href="/">🌶️ Antep Dükkanı</a>
            <!-- Sepet Butonu Eklendi -->
            <!-- Dinamik Kullanıcı Menüsü ve Sepet -->
            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="me-3 fw-bold text-secondary">👤 {{ user.username }}</span>
                    <a href="/sepet/detay/" class="btn btn-antep fw-bold me-2">🛒 Sepetim</a>
                    <a href="{% url 'cikis_yap' %}" class="btn btn-outline-danger fw-bold btn-sm">Çıkış</a>
                {% else %}
                    <a href="{% url 'giris_yap' %}" class="btn btn-outline-secondary fw-bold me-2 btn-sm">Giriş Yap</a>
                    <a href="{% url 'kayit_ol' %}" class="btn btn-secondary fw-bold me-3 btn-sm">Kayıt Ol</a>
                    <a href="/sepet/detay/" class="btn btn-antep fw-bold">🛒 Sepetim</a>
                {% endif %}
            </div>
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        <!-- Diğer sayfaların içeriği buraya gelecek -->
        {% endblock %}
    </div>
    <!-- Toast (Bildirim) Konteyneri -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
        <div id="sistemBildirimi" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold" id="bildirimMesaji">
                    İşlem başarılı!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Kapat"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Her sayfada kullanabileceğimiz global bildirim fonksiyonu -->
    <script>
        function bildirimGoster(mesaj, tip = 'bg-success') {
            const toastElement = document.getElementById('sistemBildirimi');
            const mesajElement = document.getElementById('bildirimMesaji');
            
            // Rengi ayarla (başarılıysa yeşil bg-success, hataysa kırmızı bg-danger)
            toastElement.className = `toast align-items-center text-white border-0 ${tip}`;
            mesajElement.textContent = mesaj;
            
            const toast = new bootstrap.Toast(toastElement);
            toast.show();
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</body>
</html>
