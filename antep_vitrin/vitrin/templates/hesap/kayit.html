{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-5">
                <h3 class="card-title text-center mb-4 fw-bold text-secondary">✨ Yeni Hesap Oluştur</h3>
                <form method="POST">
                    {% csrf_token %}
                    <!-- Güvenlik sebebiyle şifre kurallarını vs. Django kendisi ekrana basar -->
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-secondary w-100 btn-lg mt-3 fw-bold">Kayıt Ol</button>
                </form>
                <div class="text-center mt-4">
                    <small class="text-muted">Zaten hesabın var mı? <a href="{% url 'giris_yap' %}" class="text-decoration-none text-danger fw-bold">Giriş Yap</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
